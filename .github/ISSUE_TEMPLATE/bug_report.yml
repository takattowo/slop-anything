name: Bug report
description: A port printed the wrong thing, or a tool misbehaved.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please check the engineering ledgers (SLOP.md and the port's SLOP.md) first. Documented behaviour is intended.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem?
      options:
        - Wrong output on stdout or wrong exit code
        - A harness tool reported something untrue
        - Behaviour that is not in any ledger
        - Something wrote outside its data folder
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The exact command or tool call, the output, and what you expected.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `python -m slop_anything version`.
