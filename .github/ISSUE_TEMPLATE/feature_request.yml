name: Feature request
description: Propose a new port or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Proposal
      description: The tool to port, or the improvement, and why it matters.
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Port contract
      options:
        - label: The output stays exactly the same as the original tool.
          required: true
        - label: It writes only to its data folder, uses no network and adds no dependencies.
          required: true
