[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "slop-anything"
version = "3.1.0"
description = "Record, replay and gate command-line ports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
slop-anything = "slop_anything.cli:main"

[tool.setuptools]
packages = ["slop_anything"]
