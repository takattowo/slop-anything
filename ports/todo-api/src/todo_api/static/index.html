<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todos</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#6b7385; --line:#e3e6ec; --accent:#2f6fed; --danger:#d14343; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111318; --card:#1a1d24; --text:#e8eaf0; --muted:#9097a8; --line:#2a2e38; --accent:#6c9cff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:560px; margin:56px auto; padding:0 20px; }
  header { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px; }
  h1 { font-size:22px; margin:0; font-weight:650; letter-spacing:-0.01em; }
  .status { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  form { display:flex; gap:8px; margin-bottom:8px; }
  input[type=text] { flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); font:inherit; }
  input[type=text]:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  button { padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  .error { color:var(--danger); font-size:13px; min-height:1.5em; margin-bottom:8px; }
  ul { list-style:none; margin:0; padding:0; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  li { display:flex; align-items:center; gap:12px; padding:10px 14px; border-top:1px solid var(--line); }
  li:first-child { border-top:0; }
  li input { width:16px; height:16px; accent-color:var(--accent); }
  li .title { flex:1; word-break:break-word; }
  li.done .title { color:var(--muted); text-decoration:line-through; }
  li button { background:transparent; color:var(--muted); padding:4px 8px; font-size:13px; }
  li button:hover { color:var(--danger); }
  .empty { padding:18px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Todos</h1>
    <span class="status" id="status">Connecting</span>
  </header>
  <form id="add">
    <input id="title" type="text" placeholder="What needs doing?" maxlength="200" autocomplete="off" required>
    <button type="submit">Add</button>
  </form>
  <div class="error" id="error" role="alert"></div>
  <ul id="list"></ul>
</main>
<script>
  // Real-time sync: the view is reconciled with the server four times per second.
  const SYNC_INTERVAL_MS = 250;
  const list = document.getElementById("list");
  const statusEl = document.getElementById("status");
  const errorEl = document.getElementById("error");
  const form = document.getElementById("add");
  const titleInput = document.getElementById("title");

  async function api(method, path, body) {
    const options = { method, headers: {} };
    if (body !== undefined) {
      options.headers["Content-Type"] = "application/json";
      options.body = JSON.stringify(body);
    }
    const response = await fetch(path, options);
    if (!response.ok) {
      let message = response.statusText;
      try { message = (await response.json()).error.message; } catch (_) {}
      throw new Error(message);
    }
    return response.status === 204 ? null : response.json();
  }

  function render(todos) {
    list.replaceChildren();
    if (todos.length === 0) {
      const empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent = "Nothing to do.";
      list.append(empty);
      return;
    }
    for (const todo of todos) {
      const item = document.createElement("li");
      item.dataset.id = todo.id;
      if (todo.done) item.classList.add("done");
      const box = document.createElement("input");
      box.type = "checkbox";
      box.checked = todo.done;
      box.setAttribute("aria-label", "Done");
      const title = document.createElement("span");
      title.className = "title";
      title.textContent = todo.title;
      title.title = todo.description || "";
      const remove = document.createElement("button");
      remove.type = "button";
      remove.textContent = "Delete";
      item.append(box, title, remove);
      list.append(item);
    }
  }

  async function sync() {
    try {
      render(await api("GET", "/api/v1/todos"));
      statusEl.textContent = "Live \u00b7 synced " + new Date().toLocaleTimeString();
    } catch (_) {
      statusEl.textContent = "Offline";
    }
  }

  async function act(work) {
    errorEl.textContent = "";
    try { await work(); } catch (e) { errorEl.textContent = e.message; }
    await sync();
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    act(async () => {
      await api("POST", "/api/v1/todos", { title: titleInput.value });
      titleInput.value = "";
    });
  });

  list.addEventListener("change", (event) => {
    const item = event.target.closest("li[data-id]");
    if (item && event.target.type === "checkbox") {
      act(() => api("PATCH", "/api/v1/todos/" + item.dataset.id, { done: event.target.checked }));
    }
  });

  list.addEventListener("click", (event) => {
    const item = event.target.closest("li[data-id]");
    if (item && event.target.tagName === "BUTTON") {
      act(() => api("DELETE", "/api/v1/todos/" + item.dataset.id));
    }
  });

  sync();
  setInterval(sync, SYNC_INTERVAL_MS);
</script>
</body>
</html>
